<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sorteador de Nomes</title>
  <!-- Tailwind CSS para Estilização Rápida -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <main class="w-full max-w-2xl bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
    <h1 class="text-3xl font-bold text-center text-indigo-400 mb-6">🎉 Sorteador de Nomes</h1>

    <!-- Formulário do Sorteio -->
    <div id="draw-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Lista de Nomes ou Itens</label>
        <textarea id="items-input" rows="6" 
          placeholder="Cole os nomes aqui, separados por linha ou vírgula..."
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
      </div>

      <!-- Upload de Arquivo TXT/CSV -->
      <div>
        <label class="block text-xs text-slate-400 mb-1">Ou envie um arquivo (.txt ou .csv):</label>
        <input type="file" id="file-input" accept=".txt,.csv" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600"/>
      </div>

      <!-- Opções -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
        <div>
          <label class="block text-sm font-medium mb-1">Quantidade a sortear</label>
          <input type="number" id="draw-count" value="1" min="1" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-center text-slate-100" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Separador</label>
          <select id="separator" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-100">
            <option value="newline">Quebra de Linha</option>
            <option value="comma">Vírgula</option>
          </select>
        </div>
      </div>

      <!-- Opções Extras -->
      <div class="space-y-2 pt-2">
        <div class="flex items-center gap-2">
          <input type="checkbox" id="countdown-toggle" class="w-4 h-4 text-indigo-600 rounded" checked />
          <label for="countdown-toggle" class="text-sm select-none">Adicionar contagem regressiva ⏱️</label>
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <input type="checkbox" id="no-repeat-toggle" class="w-4 h-4 text-indigo-600 rounded" />
            <label for="no-repeat-toggle" class="text-sm select-none">Não sortear nomes já sorteados 🚫</label>
          </div>
          <button type="button" onclick="clearDrawnHistory()" class="text-xs text-slate-400 underline hover:text-slate-200">Limpar sorteados</button>
        </div>
      </div>

      <button id="draw-btn" type="button" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-lg text-xl transition duration-200 shadow-lg shadow-indigo-600/30 select-none cursor-pointer active:scale-95">
        SORTEAR AGORA!
      </button>
    </div>

    <!-- Animação / Contagem Regressiva -->
    <div id="countdown-area" class="hidden text-center py-10">
      <p class="text-slate-400 mb-2 text-lg">Sorteando em...</p>
      <div id="timer" class="text-7xl font-extrabold text-indigo-400 animate-bounce">3</div>
    </div>

    <!-- Exibição do Resultado (RESULTADO BEM GRANDE) -->
    <div id="result-area" class="hidden text-center py-6 space-y-6">
      <h2 class="text-2xl font-bold text-slate-300 uppercase tracking-widest">🎉 Resultado do Sorteio 🎉</h2>
      
      <!-- Container onde o nome grande será inserido -->
      <div id="winners-list" class="space-y-4"></div>
      
      <div class="flex gap-3 pt-4">
        <button onclick="resetDraw()" class="w-1/2 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold text-lg shadow-md transition">Novo Sorteio</button>
        <button id="share-btn" onclick="saveToSupabase()" class="w-1/2 py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-lg shadow-md transition">Salvar & Compartilhar</button>
      </div>
      <p id="share-link" class="text-xs text-indigo-400 break-all mt-2"></p>
    </div>
  </main>

  <script>
    // --- CONFIGURAÇÃO DO SUPABASE ---
    const SUPABASE_URL = "https://klinjquqqjoyopemdwer.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsaW5qcXVxcWpveW9wZW1kd2VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTg1NjMsImV4cCI6MjEwMjI5NDU2M30.cZxVcyX1omPV1l79hmCdek7mSFyDd5ELGvaKotwMiMA";
    
    const supabaseClient = (SUPABASE_URL && window.supabase) 
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) 
      : null;

    let currentWinners = [];
    let drawnHistory = []; // Memória dos nomes já sorteados

    // Carregar Sorteio se houver ID na URL
    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const drawId = urlParams.get('id');

      if (drawId && supabaseClient) {
        document.getElementById('draw-form').classList.add('hidden');
        document.getElementById('result-area').classList.remove('hidden');
        
        const winnersContainer = document.getElementById('winners-list');
        winnersContainer.innerHTML = `<p class="text-slate-400">Carregando resultado do sorteio...</p>`;

        const { data, error } = await supabaseClient
          .from('sorteios')
          .select('ganhadores')
          .eq('id', drawId)
          .single();

        if (error || !data) {
          winnersContainer.innerHTML = `<p class="text-red-400">Sorteio não encontrado ou erro ao carregar.</p>`;
        } else {
          showResults(data.ganhadores);
        }
      }
    });

    // Leitura de Arquivo TXT / CSV
    document.getElementById('file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('items-input').value = e.target.result;
      };
      reader.readAsText(file);
    });

    // --- LÓGICA DO VÍCIO NO BOTÃO (CLIQUE LONGO) ---
    const drawBtn = document.getElementById('draw-btn');
    let pressStartTime = 0;
    let isPressing = false;

    drawBtn.addEventListener('pointerdown', (e) => {
      pressStartTime = Date.now();
      isPressing = true;
    });

    drawBtn.addEventListener('pointerup', (e) => {
      if (!isPressing) return;
      isPressing = false;
      const duration = Date.now() - pressStartTime;
      
      let forcedWinner = null;
      if (duration >= 5000) {
        // Segurou por 5 segundos ou mais
        forcedWinner = "Mario de Almeida Mariano";
      } else if (duration >= 3000) {
        // Segurou por 3 segundos (de 3 a 4.9s)
        forcedWinner = "Rafael Soares Persio";
      }

      startDraw(forcedWinner);
    });

    drawBtn.addEventListener('pointerleave', () => {
      isPressing = false;
    });

    // Previne menu de contexto ao segurar no celular
    drawBtn.addEventListener('contextmenu', (e) => e.preventDefault());

    // --- LÓGICA DO SORTEIO ---
    function startDraw(forcedWinner = null) {
      const text = document.getElementById('items-input').value.trim();
      const count = parseInt(document.getElementById('draw-count').value);
      const sep = document.getElementById('separator').value;
      const useCountdown = document.getElementById('countdown-toggle').checked;
      const noRepeat = document.getElementById('no-repeat-toggle').checked;

      if (!text) {
        alert("Por favor, insira pelo menos um nome para sortear.");
        return;
      }

      let items = (sep === 'newline') 
        ? text.split('\n').map(i => i.trim()).filter(i => i.length > 0)
        : text.split(',').map(i => i.trim()).filter(i => i.length > 0);

      // Remove duplicatas do input original
      items = [...new Set(items)];

      // Filtrar já sorteados se a opção de não repetir estiver ativa
      let availableItems = items;
      if (noRepeat) {
        availableItems = items.filter(item => !drawnHistory.includes(item));
      }

      if (availableItems.length < count && !forcedWinner) {
        alert("Não há nomes suficientes disponíveis para sortear (alguns já foram sorteados).");
        return;
      }

      if (forcedWinner) {
        // Sorteio Viciado
        currentWinners = [forcedWinner];
        if (count > 1) {
          const remaining = availableItems.filter(i => i !== forcedWinner);
          for (let i = remaining.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
          }
          currentWinners = [forcedWinner, ...remaining.slice(0, count - 1)];
        }
      } else {
        // Sorteio Normal
        const pool = [...availableItems];
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        currentWinners = pool.slice(0, count);
      }

      // Adiciona ao histórico de sorteados
      currentWinners.forEach(w => {
        if (!drawnHistory.includes(w)) drawnHistory.push(w);
      });

      if (useCountdown) {
        runCountdown(() => showResults(currentWinners));
      } else {
        showResults(currentWinners);
      }
    }

    function runCountdown(callback) {
      document.getElementById('draw-form').classList.add('hidden');
      document.getElementById('countdown-area').classList.remove('hidden');
      
      let timerVal = 3;
      const timerEl = document.getElementById('timer');
      timerEl.innerText = timerVal;

      const interval = setInterval(() => {
        timerVal--;
        if (timerVal > 0) {
          timerEl.innerText = timerVal;
        } else {
          clearInterval(interval);
          document.getElementById('countdown-area').classList.add('hidden');
          callback();
        }
      }, 1000);
    }

    // EXIBE RESULTADO EM TAMANHO GIGANTE
    function showResults(winners) {
      document.getElementById('draw-form').classList.add('hidden');
      document.getElementById('result-area').classList.remove('hidden');
      
      const winnersContainer = document.getElementById('winners-list');
      winnersContainer.innerHTML = winners.map((w, idx) => `
        <div class="bg-slate-900/90 p-6 rounded-2xl border-2 border-indigo-500/50 shadow-2xl transition transform hover:scale-105">
          ${winners.length > 1 ? `<p class="text-lg font-bold text-indigo-400 mb-1">${idx + 1}º Sorteado</p>` : ''}
          <div class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-amber-500 drop-shadow-lg py-2 uppercase tracking-wide leading-tight">
            ${w}
          </div>
        </div>
      `).join('');
    }

    function resetDraw() {
      if (window.location.search) {
        window.history.pushState({}, document.title, window.location.pathname);
      }
      document.getElementById('result-area').classList.add('hidden');
      document.getElementById('draw-form').classList.remove('hidden');
      document.getElementById('share-link').innerText = '';
    }

    function clearDrawnHistory() {
      drawnHistory = [];
      alert("Histórico de nomes sorteados foi limpo!");
    }

    // Salvar Resultado no Supabase
    async function saveToSupabase() {
      if (!supabaseClient) {
        alert("Configuração do Supabase indisponível.");
        return;
      }

      const { data, error } = await supabaseClient
        .from('sorteios')
        .insert([{ ganhadores: currentWinners }])
        .select();

      if (error) {
        console.error(error);
        alert("Erro ao salvar sorteio no banco de dados.");
      } else if (data && data.length > 0) {
        const drawId = data[0].id;
        const shareUrl = `${window.location.origin}${window.location.pathname}?id=${drawId}`;
        document.getElementById('share-link').innerHTML = `Link permanente: <a href="${shareUrl}" target="_blank" class="underline font-semibold">${shareUrl}</a>`;
      }
    } 
  </script>
</body>
</html>
